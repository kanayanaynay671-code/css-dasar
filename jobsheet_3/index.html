<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toko kanaya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">LOGO</div>
        <nav>
            <ul class="menus">
                <li>Menu 1</li>
                <li>Menu 2</li>
                <li>Menu 3</li>
            </ul>
        </nav>
    </header>
    <section class="hero">
        <div class="hero-text">
            <h2>ada promo nih</h2>
            <p>buat pelanggan setia ada promo nih.</p>
            <p>penawaran terbaik dari kita untuk semua.</p>
            <button class="btn">Belanja Sekarang</button>
        </div>
        <div class="hero-image">
        </div>
    </section>

    <section class="produk-section">
        <h3>Galeri Produk</h3>
        <div class="galeri">
            <div class="card">
                <div class="card-img
                <p>macaron lucu</p>
                <button class="btn-kecil">Beli</button>
            </div>
            <div class="card">
                <div class="card-img"></div>
                <p>donat gemoyy</p>
                <button class="btn-kecil">Beli</button>
            </div>
            <div class="card">
                <div class="card-img"></div>
                <p>cake donat</p>
                <button class="btn-kecil">Beli</button>
            </div>
            <div class="card">
                <div class="card-img"></div>
                <p>eskrim cake</p>
                <button class="btn-kecil">Beli</button>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div>© TOKO KANAYA</div>
        <div class="footer-menu">
            <span>FB</span>
            <span>IG</span>
            <span>YT</span>
        </div>
    </footer>
</body>
</html>
